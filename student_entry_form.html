<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission & Entry Form | IIPS DAVV</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --primary-dark: #172554;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .form-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 28px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 13px;
            color: #bfdbfe;
            font-weight: 500;
        }

        form {
            padding: 28px 24px;
        }

        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        legend {
            padding: 0 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .required {
            color: #ef4444;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #f8fafc;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus {
            border-color: var(--primary-light);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .radio-group {
            display: flex;
            gap: 24px;
            padding: 8px 0;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .radio-label input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }

        .success-banner {
            display: none;
            margin-top: 18px;
            padding: 12px;
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 6px;
            color: var(--success);
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="header">
            <h1>International Institute of Professional Studies</h1>
            <p>Devi Ahilya Vishwavidyalaya, Indore | Student Entry Form</p>
        </div>

        <form id="studentForm" onsubmit="handleSubmit(event)">
            <fieldset>
                <legend>Academic & Student Particulars</legend>

                <!-- 1. Roll No -->
                <div class="form-group">
                    <label for="rollNo">Student Roll Number <span class="required">*</span></label>
                    <input type="text" id="rollNo" name="rollNo" value="IM-2K26-58" placeholder="e.g. IM-2K26-58" pattern="^[A-Za-z0-9\-]+$" required title="Format: IM-2K26-58">
                </div>

                <!-- 2. Name of student -->
                <div class="form-group">
                    <label for="studentName">Name of Student <span class="required">*</span></label>
                    <input type="text" id="studentName" name="studentName" value="Krishna Dixit" placeholder="Enter Full Name (e.g. Krishna Dixit)" required>
                </div>

                <!-- 3. Program Name -->
                <div class="form-group">
                    <label for="programName">Program Name <span class="required">*</span></label>
                    <select id="programName" name="programName" required>
                        <option value="" disabled selected>-- Select Program --</option>
                        <option value="MBA(MS) 5 Yrs" selected>MBA (Management Science) 5 Yrs Integrated</option>
                        <option value="MBA(Tourism) 5 Yrs">MBA (Tourism) 5 Yrs Integrated</option>
                        <option value="MCA 6 Yrs">MCA 6 Yrs Integrated</option>
                        <option value="M.Tech(IT) 5 Yrs">M.Tech (IT) 5 Yrs Integrated</option>
                    </select>
                </div>

                <!-- 4. Class -->
                <div class="form-group">
                    <label for="studentClass">Class & Academic Term <span class="required">*</span></label>
                    <select id="studentClass" name="studentClass" required>
                        <option value="" disabled selected>-- Select Class --</option>
                        <option value="I Year (Semester I)" selected>1st Year (Semester I)</option>
                        <option value="I Year (Semester II)">1st Year (Semester II)</option>
                        <option value="II Year (Semester III)">2nd Year (Semester III)</option>
                        <option value="II Year (Semester IV)">2nd Year (Semester IV)</option>
                    </select>
                </div>

                <!-- 5. Section -->
                <div class="form-group">
                    <label>Section <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="section" value="Section A" checked required> Section A
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="section" value="Section B" required> Section B
                        </label>
                    </div>
                </div>

            </fieldset>

            <div class="button-group">
                <button type="submit" class="btn-submit">Submit Record</button>
                <button type="reset" class="btn-reset">Reset Form</button>
            </div>

            <div id="successMsg" class="success-banner">
                ✓ Student record registered successfully!
            </div>
        </form>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';
            setTimeout(() => {
                msg.scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }
    </script>
</body>
</html>
